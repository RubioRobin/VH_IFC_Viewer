[functions.revit-api]
# Health checks have no user JWT; protected routes validate Supabase Auth inside
# the function. The desktop add-in contains no separate shared secret.
verify_jwt = false

[functions.viewer-link]
# QR links are intentionally public; the function only resolves active shares.
verify_jwt = false

[functions.admin-api]
# The function validates Supabase sessions and admin app_metadata itself. The
# legacy username bridge is intentionally pre-authentication and only copies an
# existing bcrypt hash; Supabase Auth still verifies the plaintext password.
verify_jwt = false

[functions.retention-cleanup]
# GitHub Actions invokes this scheduled maintenance endpoint with a dedicated,
# high-entropy cleanup key that the function validates itself.
verify_jwt = false
