<!doctype html>
<html lang="nl" translate="no" class="bim-ui-light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/vh_prefab_engineering_logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>VH Engineering IFC Viewer</title>
  <!-- Font Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html {
      font-size: 17px;
      font-family: 'Outfit', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      /* Removed overflow:hidden here as it's handled by app */
      background-color: #101112;
      height: 100vh;
      width: 100vw;
    }

    #initial-loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at center, rgba(193, 169, 121, 0.12), transparent 30%),
        #101112;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f4efe4;
      transition: opacity 140ms ease-out;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(244, 239, 228, 0.2);
      border-top: 4px solid #c1a979;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 24px rgba(193, 169, 121, 0.12);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-shell {
      box-sizing: border-box;
      width: min(32rem, calc(100% - 2rem));
      display: grid;
      justify-items: center;
      padding: 2rem;
      text-align: center;
    }

    #initial-loading-overlay h1 {
      margin: 1.35rem 0 0.5rem;
      color: #f4efe4;
      font-size: 1.35rem;
      font-weight: 600;
    }

    #initial-loading-overlay p {
      max-width: 32rem;
      margin: 0;
      color: #c9c4ba;
      line-height: 1.5;
      text-align: center;
    }

    #initial-loading-overlay.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2.5s;
      }

      #initial-loading-overlay {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div id="initial-loading-overlay" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-shell">
      <div class="spinner" aria-hidden="true"></div>
      <h1 data-loading-title>Viewer voorbereiden</h1>
      <p data-loading-detail>De IFC-viewer wordt gestart.</p>
      <div class="loading-progress" data-loading-progress hidden>
        <div
          class="loading-progress__track"
          role="progressbar"
          aria-label="Downloadvoortgang"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <span data-loading-progress-value></span>
        </div>
        <span class="loading-progress__label" data-loading-progress-label></span>
      </div>
      <div class="loading-actions" data-loading-actions></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>

</html>
