name: Revit Add-in Build

on:
  push:
    branches: [ "main", "master", "release/**" ]
    paths:
      - 'addin/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'addin/**'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore addin/VH_IFC_QR.csproj

    - name: Build Add-in (Release)
      run: dotnet build addin/VH_IFC_QR.csproj --configuration Release --no-restore -p:CopyToRevitAddins=false

    - name: Upload Artifact (DLL and Addin)
      uses: actions/upload-artifact@v4
      with:
        name: vh-ifc-viewer-addin-Release
        path: |
          addin/bin/Release/net8.0-windows/**
